<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Superfast Scanner - Barsoi Public School</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
    body {
        background: linear-gradient(135deg, #f0f4f8, #d9e8df);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        margin: 0;
        padding: 10px;
    }
    .scanner-container {
        max-width: 750px;
        width: 100%;
        margin: auto;
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        padding: 20px;
        text-align: center;
    }
    .header-title {
        color: #0f5132;
        font-weight: 800;
        letter-spacing: 0.5px;
        margin-bottom: 2px;
        font-size: 1.5rem;
    }
    .sub-title {
        color: #198754;
        font-weight: 600;
        font-size: 1rem;
        margin-bottom: 15px;
    }
    /* Large Full View Camera Box */
    #reader {
        width: 100% !important;
        min-height: 420px !important;
        border: 4px solid #198754 !important;
        border-radius: 15px !important;
        background: #000 !important;
        overflow: hidden;
        padding: 0 !important;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #reader video {
        width: 100% !important;
        height: 100% !important;
        max-height: 480px !important;
        object-fit: cover !important;
        border-radius: 10px;
        transform: scaleX(1) !important;
    }
    .camera-select {
        margin-bottom: 12px;
    }
    .footer-note {
        font-size: 0.85rem;
        color: #6c757d;
        margin-top: 15px;
    }
</style>
</head>
<body>

<div class="container">
    <div class="scanner-container">
        <h2 class="header-title"><i class="fa-solid fa-graduation-cap me-2"></i>BARSOI PUBLIC SCHOOL</h2>
        <p class="sub-title"><i class="fa-solid fa-qrcode me-1"></i> Students' Attendance Scanner</p>
        
        <!-- Camera Selection Dropdown -->
        <div class="camera-select">
            <select id="cameraSelection" class="form-select border-success fw-bold text-center" onchange="changeCamera()">
                <option value="">Select Camera...</option>
            </select>
        </div>

        <!-- Large Full Screen Camera View -->
        <div id="reader"></div>

        <p class="footer-note">Position the student's QR code clearly inside the large camera frame for instant automatic marking.</p>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz4ST4RCzKbLGUMsXCH8_JHljLfe30vGEk_L7aqjRWfH6MyJ5UD0ilXYj4lwWANiQQKWQ/exec";

    let html5QrCode;
    let currentCameraId = null;

    function initScanner() {
        html5QrCode = new Html5Qrcode("reader");

        Html5Qrcode.getCameras().then(devices => {
            if (devices && devices.length) {
                const cameraSelect = document.getElementById('cameraSelection');
                cameraSelect.innerHTML = '';

                devices.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.id;
                    option.text = device.label || `Camera ${index + 1}`;
                    cameraSelect.appendChild(option);
                });

                // Default back camera preference
                let selectedCam = devices.find(d => d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('environment'));
                currentCameraId = selectedCam ? selectedCam.id : devices[0].id;
                cameraSelect.value = currentCameraId;

                startScanning(currentCameraId);
            } else {
                Swal.fire('Error', 'No camera found on this device!', 'error');
            }
        }).catch(err => {
            console.error("Camera access error: ", err);
        });
    }

    function startScanning(cameraId) {
        // High performance constraints for both front and back cameras
        const qrboxSetting = window.innerWidth < 500 ? 250 : 320;
        
        const config = {
            fps: 30,
            qrbox: { width: qrboxSetting, height: qrboxSetting },
            aspectRatio: 4/3,
            videoConstraints: {
                deviceId: { exact: cameraId },
                width: { ideal: 1280 },
                height: { ideal: 720 },
                facingMode: "user"
            },
            experimentalFeatures: {
                useBarCodeDetectorIfSupported: true
            }
        };

        html5QrCode.start(
            cameraId, 
            config, 
            onScanSuccess
        ).catch(err => {
            // Fallback config agar exact device constraint fail ho jaye
            html5QrCode.start(
                cameraId, 
                { fps: 20, qrbox: { width: 280, height: 280 } }, 
                onScanSuccess
            ).catch(e => console.error("Fallback start failed", e));
        });
    }

    function changeCamera() {
        const selectedCam = document.getElementById('cameraSelection').value;
        if (html5QrCode && selectedCam !== currentCameraId) {
            html5QrCode.stop().then(() => {
                currentCameraId = selectedCam;
                startScanning(currentCameraId);
            }).catch(err => console.error("Error stopping camera", err));
        }
    }

    function onScanSuccess(decodedText) {
        try {
            let data = JSON.parse(decodedText);
            html5QrCode.stop().then(() => {
                markAttendance(data);
            });
        } catch (e) {
            Swal.fire({
                icon: 'error',
                title: 'Invalid QR Code',
                text: 'This QR code is not valid!',
                confirmButtonColor: '#198754'
            }).then(() => restartScanner());
        }
    }

    function markAttendance(studentData) {
        Swal.fire({
            title: 'Marking Present...',
            text: `${studentData.name} (${studentData.class})`,
            allowOutsideClick: false,
            didOpen: () => Swal.showLoading()
        });

        fetch(`${API_URL}?action=markAttendance&data=${encodeURIComponent(JSON.stringify(studentData))}`)
            .then(res => res.json())
            .then(res => {
                if (res.status === "Success") {
                    Swal.fire({
                        icon: 'success',
                        title: 'Present Marked!',
                        text: `${res.name} - Class ${studentData.class}`,
                        timer: 1500,
                        showConfirmButton: false
                    }).then(() => restartScanner());
                } else if (res.status === "Already Marked") {
                    Swal.fire({
                        icon: 'info',
                        title: 'Already Marked',
                        text: `${res.name} ! Your attendance has been marked today.`,
                        timer: 2000,
                        showConfirmButton: false
                    }).then(() => restartScanner());
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: res.message || 'Failed',
                        confirmButtonColor: '#198754'
                    }).then(() => restartScanner());
                }
            })
            .catch(() => {
                Swal.fire({
                    icon: 'error',
                    title: 'Connection Failed',
                    text: 'Could not connect to the Server!',
                    confirmButtonColor: '#198754'
                }).then(() => restartScanner());
            });
    }

    function restartScanner() {
        if (currentCameraId) {
            startScanning(currentCameraId);
        } else {
            initScanner();
        }
    }

    document.addEventListener("DOMContentLoaded", initScanner);
</script>
</body>
</html>
